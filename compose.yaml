services:
  novosga:
    build: .
    image: novosga/novosga:2.2-standalone
    restart: always
    depends_on:
      - mysqldb
    ports:
      - "80:8080"
    volumes:
      - ./imagens:/var/www/html/public/images
      - ./NovosgaCustomersBundle.pt_BR.xlf:/var/www/html/vendor/novosga/customers-bundle/src/Resources/translations/NovosgaCustomersBundle.pt_BR.xlf
      - ./NovosgaTriageBundle.pt_BR.xlf:/var/www/html/vendor/novosga/triage-bundle/src/Resources/translations/NovosgaTriageBundle.pt_BR.xlf
      - ./NovosgaAttendanceBundle.pt_BR.xlf:/var/www/html/vendor/novosga/attendance-bundle/src/Resources/translations/NovosgaAttendanceBundle.pt_BR.xlf
      - ./templates/attendance-index.html.twig:/var/www/html/vendor/novosga/attendance-bundle/src/Resources/views/default/index.html.twig

    environment:
      APP_ENV: 'prod'
      DATABASE_URL: 'mysql://novosga:150769@mysqldb:3306/novosga2?charset=utf8mb4&serverVersion=8.0'
      NOVOSGA_ADMIN_USERNAME: 'admin'
      NOVOSGA_ADMIN_PASSWORD: '123456'
      NOVOSGA_ADMIN_FIRSTNAME: 'Administrador'
      NOVOSGA_ADMIN_LASTNAME: 'Global'
      NOVOSGA_UNITY_NAME: 'Unidade Vereador Durval Samuel de Souza - Andaia'
      NOVOSGA_UNITY_CODE: 'U01'
      NOVOSGA_NOPRIORITY_NAME: 'Normal'
      NOVOSGA_NOPRIORITY_DESCRIPTION: 'Atendimento normal'
      NOVOSGA_PRIORITY_NAME: 'Prioridade'
      NOVOSGA_PRIORITY_DESCRIPTION: 'Atendimento prioritário'
      NOVOSGA_PLACE_NAME: 'Guichê'
      TZ: 'America/Sao_Paulo'
      APP_LANGUAGE: 'pt_BR'
      MERCURE_URL: http://mercure:3000/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: "eyJhbGciOiJIUzI1NiJ9.eyJtZXJjdXJlIjp7InB1Ymxpc2giOlsiKiJdfX0.Carr3UqDSoWjUY4fCOrizjTZ4a2LQ6cx35cd6QdahZY"

  mercure:
    image: novosga/mercure:v0.11
    restart: always
    ports:
      - "3000:3000"
    environment:
      SERVER_NAME: ":3000"
      MERCURE_PUBLISHER_JWT_KEY: "eyJhbGciOiJIUzI1NiJ9.eyJtZXJjdXJlIjp7InB1Ymxpc2giOlsiKiJdfX0.Carr3UqDSoWjUY4fCOrizjTZ4a2LQ6cx35cd6QdahZY"
      MERCURE_EXTRA_DIRECTIVES: "anonymous 1; cors_origins *"

  panel:
    image: novosga/panel-app
    restart: always
    depends_on:
      - novosga
    ports:
      - "8081:80"
    environment:
      VUE_APP_API_BASE_URL: http://localhost
      VUE_APP_MERCURE_URL: http://localhost:3000/.well-known/mercure

  mysqldb:
    image: mysql:8.0
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: 'novosga'
      MYSQL_DATABASE: 'novosga2'
      MYSQL_ROOT_PASSWORD: '150769'
      MYSQL_PASSWORD: '150769'
      TZ: 'America/Sao_Paulo'
      
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: